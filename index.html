<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Gửi Quỳnh Anh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #010001;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Canvas hiệu ứng dải lụa dòng chảy */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Nút điều khiển nhạc riêng */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Phong bì thư ở giữa */
        .envelope-container {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #fff;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Nắp phong bì */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #e0e0e0;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
        }

        .envelope-text {
            position: relative;
            z-index: 4;
            font-size: 18px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 40px;
            pointer-events: none;
        }

        /* Khi mở thư: Phong bì ẩn đi */
        .envelope-container.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope-container.open {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: all 0.5s ease;
            position: absolute;
        }

        /* Bức thư */
        .letter-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 90%;
            max-width: 600px;
            background: #fff;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .letter-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .letter-title {
            font-size: 22px;
            color: #d63384;
            margin-bottom: 15px;
            font-family: serif;
            font-weight: bold;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.7;
            text-align: left;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .letter-content::-webkit-scrollbar {
            width: 6px;
        }
        .letter-content::-webkit-scrollbar-thumb {
            background-color: #f0a5c0;
            border-radius: 3px;
        }

        .close-btn {
            margin-top: 20px;
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #b02a6b;
        }
    </style>
</head>
<body>

    <!-- THẺ NHẠC LOVE2.MP3 -->
    <audio id="bgMusic" loop>
        <source src="love2.mp3" type="audio/mp3">
        Trình duyệt của bạn không hỗ trợ thẻ âm thanh.
    </audio>

    <!-- Nút bật/tắt nhạc góc trên bên phải -->
    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 <span id="musicStatus">Bật nhạc</span>
    </button>

    <!-- Canvas hiệu ứng dải lụa uốn lượn chéo mượt mà -->
    <canvas id="bgCanvas"></canvas>

    <!-- Phong bì thư bấm vào để mở -->
    <div class="envelope-container" id="envelopeBtn" onclick="openLetter()">
        <div class="envelope">
            <div class="envelope-text">💌 Chạm để mở thư</div>
        </div>
    </div>

    <!-- Bức thư hiện ra -->
    <div class="letter-modal" id="letterModal">
        <div class="letter-title">Gửi Quỳnh Anh ❤️</div>
        <div class="letter-content" id="letterText"></div>
        <button class="close-btn" onclick="closeLetter()">Đóng thư</button>
    </div>

    <script>
        const fullText = `Chúng mình đã chính thức yêu nhau được 2 tháng này rồi bé.
Đây là bức thư tình thứ 2 trong chuyên mục mỗi tháng 1 bó hoa kỉ niệm của chúng ta và 1 bức thư tình gửi đến bé.
Tháng thứ 2 đầy ắp những niềm vui, nhưng cũng có một số khoảng lặng nhỉ. Cảm ơn vì sau tất cả vẫn cho anh tiếp tục được yêu thương em, cho anh được có cơ hội chứng minh lại những điều anh từng làm chưa tốt. Em có thể dành một chút thời gian nghe anh già này sến súa thật lòng một chút được không.

Anh biết sau hôm đó dù mình đã quay lại nhưng sự tự nhiên của 2 ta phần nào đã không còn được như ban đầu. Anh chỉ muốn nói là anh xin lỗi vì lúc đó đã chưa được tốt, kể cả ngay sau khi em nói ra điều làm em buồn thì anh cũng đã thực sự không bình tĩnh mà cứ cố gắng giải thích, ép em phải thay đổi suy nghĩ ngay lập tức từ những gì tự mình vừa chứng kiến mà hoàn toàn không để cho em một chút thời gian nào, rồi dần dần chính anh là người tự đẩy 2 ta ra xa khiến hôm đó em muốn dừng lại. Vào thời điểm em nói “anh biến mất khỏi đời tôi” đi thực sự anh rất buồn và rất lo lắng vì làm tổn thương em như thế. Khi đó thật sự nếu có điều kiện ở gần sân bay thì anh sẽ không cần suy nghĩ mà bay thẳng về để được gặp em.

Những chuyện đã xảy ra rồi mình cũng không thể xóa đi được, nhưng điều duy nhất anh muốn nói với em là kể từ thời điểm mình yêu nhau, em luôn là điều rất quan trọng với anh, chưa một giây nào anh để những thứ khác làm mình phải lăn tăn, đắn đo với em cả, anh luôn muốn có một tình yêu All in với em. Kể cả những điều anh từng nói đến chuyện lâu dài của 2 đứa cũng là điều thật lòng anh nói, vì anh thật sự nghiêm túc với mối quan hệ này, với em. Anh biết những gì em chứng kiến dù thực hay chỉ là hiểu lầm thì em cũng cần thời gian thích nghi. Buồn thật nhỉ, nhưng lần này anh sẽ không mất bình tĩnh nữa, vì anh tin đến một thời điểm nào đó mình sẽ lại được tự nhiên như xưa và còn tốt hơn thế nữa.

Thui hết đoạn sến súa dãi bài rồi. Và sau tất cả anh vẫn muốn nói là.

Anh yêu Quỳnh Anh của anh nhiều lắm!

Nam Yêu Quỳnh Anh.`;

        // --- 1. ĐIỀU KHIỂN NHẠC LOVE2.MP3 ---
        const bgMusic = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicStatus.innerText = "Bật nhạc";
                isMusicPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicStatus.innerText = "Tắt nhạc";
                    isMusicPlaying = true;
                }).catch(e => {
                    console.log("Trình duyệt chặn phát nhạc tự động:", e);
                });
            }
        }


        // --- 2. HIỆU ỨNG DẢI LỤA UỐN LƯỢN HỮU CƠ ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const silkStreams = [];
        const streamCount = 14; 
        
        for (let i = 0; i < streamCount; i++) {
            silkStreams.push({
                startX: -100,
                startY: (canvas.height / streamCount) * i + (Math.random() * 80 - 40),
                amplitude: Math.random() * 120 + 40,
                frequency: Math.random() * 0.0009 + 0.0004,
                speed: Math.random() * 0.35 + 0.1,
                offset: Math.random() * 2000,
                thickness: Math.random() * 35 + 4,
                maxAlpha: Math.random() * 0.14 + 0.02,
                angleTilt: (Math.random() - 0.5) * 0.35,
                pulseSpeed: Math.random() * 0.02 + 0.008,
                pulseOffset: Math.random() * Math.PI * 2
            });
        }

        const imageSources = [
            'anh (1).jpg',
            'anh (2).jpg',
            'anh (3).jpg',
            'anh (4).jpg',
            'anh (5).jpg'
        ];

        const loadedImages = [];
        imageSources.forEach((src) => {
            const img = new Image();
            img.src = src;
            loadedImages.push(img);
        });

        const bubbles = [];
        const bubbleCount = 16; 

        for (let i = 0; i < bubbleCount; i++) {
            bubbles.push({
                x: Math.random() * canvas.width - canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 40 + 45,
                speedX: Math.random() * 0.6 + 0.4,
                speedY: (Math.random() - 0.5) * 0.3,
                wobbleSpeed: Math.random() * 0.02 + 0.01,
                wobbleDist: Math.random() * 15 + 5,
                initialY: Math.random() * canvas.height,
                angle: Math.random() * Math.PI * 2,
                imageIndex: Math.floor(Math.random() * imageSources.length)
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ các dải lụa
            silkStreams.forEach(stream => {
                stream.offset += stream.speed;
                stream.pulseOffset += stream.pulseSpeed;

                let currentAlpha = stream.maxAlpha * (0.6 + 0.4 * Math.sin(stream.pulseOffset));

                ctx.save();
                ctx.beginPath();

                let stepSize = 20;
                let totalLength = canvas.width + 200;

                for (let x = -100; x <= totalLength; x += stepSize) {
                    let y = stream.startY + 
                            (x * stream.angleTilt) +
                            Math.sin((x + stream.offset) * stream.frequency) * stream.amplitude +
                            Math.cos((x - stream.offset) * 0.0006) * (stream.amplitude * 0.5);
                    
                    if (x === -100) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                let grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
                grad.addColorStop(0, 'rgba(255, 105, 180, 0)');
                grad.addColorStop(0.25, `rgba(255, 140, 185, ${currentAlpha})`);
                grad.addColorStop(0.5, `rgba(255, 192, 203, ${currentAlpha * 1.4})`);
                grad.addColorStop(0.75, `rgba(255, 140, 185, ${currentAlpha})`);
                grad.addColorStop(1, 'rgba(255, 105, 180, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = stream.thickness;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 105, 180, 0.45)';
                ctx.stroke();
                ctx.restore();
            });

            // Vẽ bong bóng chứa ảnh
            bubbles.forEach(b => {
                b.x += b.speedX;
                b.angle += b.wobbleSpeed;
                b.y = b.initialY + Math.sin(b.angle) * b.wobbleDist;

                if (b.x > canvas.width + b.radius * 2) {
                    b.x = -b.radius * 2;
                    b.initialY = Math.random() * canvas.height;
                }

                ctx.save();

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius - 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                const img = loadedImages[b.imageIndex];
                if (img && img.complete && img.naturalWidth !== 0) {
                    let padding = 6;
                    let size = (b.radius - padding) * 2;
                    ctx.drawImage(img, b.x - b.radius + padding, b.y - b.radius + padding, size, size);
                } else {
                    ctx.fillStyle = '#ffb6c1';
                    ctx.fill();
                }
                ctx.restore();

                const rainbowGlow = ctx.createRadialGradient(
                    b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1,
                    b.x, b.y, b.radius
                );
                rainbowGlow.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
                rainbowGlow.addColorStop(0.3, 'rgba(255, 182, 193, 0.25)');
                rainbowGlow.addColorStop(0.5, 'rgba(255, 255, 150, 0.25)');
                rainbowGlow.addColorStop(0.7, 'rgba(150, 222, 255, 0.25)');
                rainbowGlow.addColorStop(0.9, 'rgba(221, 160, 221, 0.3)');
                rainbowGlow.addColorStop(1, 'rgba(255, 255, 255, 0.6)');

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = rainbowGlow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(b.x - b.radius * 0.35, b.y - b.radius * 0.35, b.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(b.x - b.radius * 0.5, b.y - b.radius * 0.15, b.radius * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();

                ctx.restore();
            });

            requestAnimationFrame(animate);
        }
        animate();


        // --- 3. HIỆU ỨNG GÕ CHỮ & MỞ THƯ ---
        let typingTimer = null;

        function startTypingEffect() {
            const textContainer = document.getElementById('letterText');
            textContainer.innerHTML = "";
            let index = 0;

            function type() {
                if (index < fullText.length) {
                    textContainer.innerHTML += fullText.charAt(index);
                    index++;
                    textContainer.scrollTop = textContainer.scrollHeight;
                    typingTimer = setTimeout(type, 35);
                }
            }
            type();
        }

        function openLetter() {
            const container = document.getElementById('envelopeBtn');
            const modal = document.getElementById('letterModal');

            container.classList.add('open');
            setTimeout(() => {
                modal.classList.add('show');
                startTypingEffect();
            }, 300);

            // Tự động phát bài love2.mp3 khi mở thư (nếu chưa bật)
            if (!isMusicPlaying) {
                toggleMusic();
            }
        }

        function closeLetter() {
            const container = document.getElementById('envelopeBtn');
            const modal = document.getElementById('letterModal');

            if (typingTimer) clearTimeout(typingTimer);
            modal.classList.remove('show');
            setTimeout(() => {
                container.classList.remove('open');
            }, 300);
        }
    </script>
</body>
</html>
