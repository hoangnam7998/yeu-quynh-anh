<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Quỳnh Anh ❤️</title>
    
    <!-- Nhúng Font uốn lượn sắc nét Great Vibes -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0208;
            font-family: 'Great Vibes', cursive;
            perspective: 1000px; /* Tạo không gian 3D tổng thể */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Lớp chứa hiệu ứng 3D ảnh rơi */
        #space3D {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            transform-style: preserve-3d;
            overflow: hidden;
        }
        
        .falling-photo {
            position: absolute;
            border-radius: 10px;
            border: 2px solid rgba(255, 182, 193, 0.9);
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
            filter: brightness(1.35) contrast(1.1); /* Tăng độ sáng và nét cho ảnh */
            will-change: transform, opacity;
        }

        /* Đẩy canvas Matrix và Text lên trên lớp ảnh 3D */
        #matrixCanvas { z-index: 2; opacity: 0.75; }
        #textCanvas { z-index: 3; }

        /* Màn hình chờ mở nhạc */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .heart-btn {
            font-size: 60px;
            animation: beat 1.2s infinite alternate;
            margin-bottom: 15px;
        }
        .start-text {
            color: #ffb6c1;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            padding: 0 20px;
            letter-spacing: 0.5px;
        }
        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ bắt buộc chạm để bật nhạc -->
    <div id="startOverlay">
        <div class="heart-btn">💖</div>
        <div class="start-text">Chạm vào đây để mở món quà nhỏ từ anh nhé ❤️</div>
    </div>

    <!-- KHÔNG GIAN 3D CHỨA ẢNH RƠI -->
    <div id="space3D"></div>

    <!-- THẺ ÂM THANH -->
    <audio id="bgMusic" loop>
        <source src="love.mp3" type="audio/mpeg">
    </audio>

    <canvas id="matrixCanvas"></canvas>
    <canvas id="textCanvas"></canvas>

<script>
    function setupCanvas(canvas) {
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        return { width, height };
    }

    const matrixCanvas = document.getElementById('matrixCanvas');
    const ctxM = matrixCanvas.getContext('2d');
    
    const textCanvas = document.getElementById('textCanvas');
    const ctxT = textCanvas.getContext('2d');

    let size = setupCanvas(matrixCanvas);
    setupCanvas(textCanvas);

    const chars = '0123456789ABCDEF♥💕🌸✨';
    const fontSize = 11; 
    let columns = Math.floor(size.width / fontSize);
    let drops = Array(columns).fill(0).map(() => Math.random() * -100);

    function drawMatrix() {
        ctxM.fillStyle = 'rgba(13, 2, 8, 0.12)'; 
        ctxM.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

        ctxM.fillStyle = '#ffb6c1'; 
        ctxM.font = fontSize + 'px monospace';

        const isFinalState = (typeof state !== 'undefined' && state === "END");
        const speed = isFinalState ? (0.4 / 2) : 0.4;

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctxM.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > size.height && Math.random() > 0.985) {
                drops[i] = 0;
            }
            drops[i] += speed; 
        }
    }

    const messages = [
        "14/8/2026 - 14/9/2026",
        "Yeeee mình yêu nhau được 1 tháng rồi",
        "Và nói chuyện với nhau được 191 ngày không đứt chuỗi ",
        "Yêu Bé Iuuu siêu cấp vũ trụ của anh",
        "Nam ❤️ Quỳnh Anh"
    ];

    let msgIndex = 0;
    let state = "FADE_IN"; 
    let alpha = 0;
    let stateTimer = 0;
    let glowAngle = 0;
    let lastTime = performance.now();
    let finalBurstTriggered = false; // Biến kiểm tra hiệu ứng bùng nổ ảnh 1 lần

    function wrapText(text, maxWidth) {
        const words = text.split(' ');
        let lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
            let word = words[i];
            let metrics = ctxT.measureText(currentLine + " " + word);
            if (metrics.width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);
        return lines;
    }

    function drawSmoothText(text, opacity) {
        const isFinal = (msgIndex === messages.length - 1);
        
        const screenWidth = window.innerWidth;
        let baseFontSize = screenWidth < 500 ? (screenWidth / (isFinal ? 9 : 11)) : (screenWidth / 12);
        
        const minSize = 20;
        const maxSize = isFinal ? 50 : 38;
        baseFontSize = Math.max(minSize, Math.min(baseFontSize, maxSize));
        
        ctxT.font = `${baseFontSize}px "Great Vibes", cursive`;
        ctxT.textBaseline = "middle";
        
        const maxWidth = size.width * 0.85;
        const lines = wrapText(text, maxWidth);
        
        const lineHeight = baseFontSize * 1.25;
        const startY = (size.height / 2) - ((lines.length - 1) * lineHeight / 2);

        glowAngle += 0.04;
        const pulse = (Math.sin(glowAngle) + 1) / 2;

        ctxT.save();
        ctxT.globalAlpha = Math.max(0, opacity);

        const glowColor = `rgba(255, 105, 180, ${0.85 + pulse * 0.15})`;
        const blurLayers = isFinal ? [6, 15, 25, 40] : [5, 12, 20];      

        blurLayers.forEach(blur => {
            ctxT.shadowColor = glowColor;
            ctxT.shadowBlur = blur;
            ctxT.fillStyle = "#FFFFFF";

            lines.forEach((line, index) => {
                const currentY = startY + (index * lineHeight);
                if (isFinal && line.includes("Nam ❤️ Quỳnh Anh")) {
                    drawCenteredCompositeLine(line, size.width / 2, currentY, false, blurLayers);
                } else {
                    ctxT.textAlign = "center";
                    ctxT.fillText(line, size.width / 2, currentY);
                }
            });
        });

        ctxT.shadowColor = "transparent";
        ctxT.shadowBlur = 0;
        ctxT.fillStyle = "#FFFFFF";

        lines.forEach((line, index) => {
            const currentY = startY + (index * lineHeight);
            if (isFinal && line.includes("Nam ❤️ Quỳnh Anh")) {
                drawCenteredCompositeLine(line, size.width / 2, currentY, true, blurLayers);
            } else {
                ctxT.textAlign = "center";
                ctxT.fillText(line, size.width / 2, currentY);
            }
        });

        ctxT.restore();
    }

    function drawCenteredCompositeLine(line, centerX, y, isMainText, blurLayers) {
        const parts = ["Nam ", "❤️", " Quỳnh Anh"];
        
        let totalWidth = 0;
        parts.forEach(part => {
            if (part === "❤️") {
                ctxT.font = `${parseInt(ctxT.font)}px sans-serif`;
            }
            totalWidth += ctxT.measureText(part).width;
            if (part === "❤️") {
                ctxT.font = `${parseInt(ctxT.font)}px "Great Vibes", cursive`;
            }
        });

        let currentX = centerX - (totalWidth / 2);
        
        parts.forEach(part => {
            if (part === "❤️") {
                ctxT.font = `${parseInt(ctxT.font)}px sans-serif`;
                if (isMainText) ctxT.shadowBlur = 0;
            } else {
                if (!isMainText && blurLayers) ctxT.shadowBlur = blurLayers[blurLayers.length - 1];
            }
            
            ctxT.textAlign = "left";
            ctxT.fillText(part, currentX, y);
            
            currentX += ctxT.measureText(part).width;

            if (part === "❤️") {
                ctxT.font = `${parseInt(ctxT.font)}px "Great Vibes", cursive`;
            }
        });
    }

    function animateText(currentTime) {
        const deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        ctxT.clearRect(0, 0, size.width, size.height);

        const isFinal = (msgIndex === messages.length - 1);

        if (state === "FADE_IN") {
            alpha += deltaTime * 1.2;
            drawSmoothText(messages[msgIndex], alpha);

            if (alpha >= 1) {
                alpha = 1;
                state = "HOLD";
                stateTimer = 0;
            }
        } 
        else if (state === "HOLD") {
            drawSmoothText(messages[msgIndex], 1);
            stateTimer += deltaTime;

            if (stateTimer > 2.5) {
                if (isFinal) {
                    state = "END";
                } else {
                    state = "FADE_OUT";
                }
            }
        } 
        else if (state === "FADE_OUT") {
            alpha -= deltaTime * 1.2;
            drawSmoothText(messages[msgIndex], alpha);

            if (alpha <= 0) {
                alpha = 0;
                msgIndex++;
                state = "FADE_IN";
            }
        } 
        else if (state === "END") {
            drawSmoothText(messages[msgIndex], 1);
            
            // Kích hoạt trận mưa ảnh bùng nổ (dày hơn gấp nhiều lần) đúng 1 lần khi đến dòng cuối
            if (!finalBurstTriggered) {
                finalBurstTriggered = true;
                for (let k = 0; k < 22; k++) {
                    setTimeout(() => {
                        create3DPhoto();
                    }, k * 70);
                }
            }
        }
    }

    function loop(currentTime) {
        drawMatrix();
        animateText(currentTime);
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    // --- TỰ ĐỘNG TẠO VÀ XÀO TRỘN NGẪU NHIÊN 33 ẢNH ---
    const totalPhotos = 33; 
    let photoList = [];
    for (let i = 1; i <= totalPhotos; i++) {
        photoList.push(`images/anh (${i}).jpg`);
    }

    for (let i = photoList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photoList[i], photoList[j]] = [photoList[j], photoList[i]];
    }

    const space3D = document.getElementById('space3D');
    const activePhotos = [];

    function create3DPhoto() {
        const img = document.createElement('img');
        img.src = photoList[Math.floor(Math.random() * photoList.length)];
        img.className = 'falling-photo';

        // Kích thước ngẫu nhiên (từ 75px đến 145px)
        const size = Math.floor(Math.random() * 70) + 75;
        img.style.width = size + 'px';
        img.style.height = size + 'px';

        const x = Math.random() * (window.innerWidth - size);
        let y = -150;
        
        const z = (Math.random() - 0.5) * 400; 
        
        const rotX = Math.random() * 360;
        const rotY = Math.random() * 360;
        const rotZ = (Math.random() - 0.5) * 90;

        const speedY = Math.random() * 1.2 + 0.8;
        const rotSpeedX = (Math.random() - 0.5) * 0.8;
        const rotSpeedY = (Math.random() - 0.5) * 0.8;

        // Tăng độ trong suốt lên mức cao hơn để ảnh sáng rõ, sắc nét
        const opacity = z < 0 ? 0.75 : 1.0;
        img.style.opacity = opacity;

        space3D.appendChild(img);

        const photoObj = {
            element: img,
            x: x,
            y: y,
            z: z,
            rotX: rotX,
            rotY: rotY,
            rotZ: rotZ,
            speedY: speedY,
            rotSpeedX: rotSpeedX,
            rotSpeedY: rotSpeedY
        };

        activePhotos.push(photoObj);
    }

    function update3DPhotos() {
        for (let i = activePhotos.length - 1; i >= 0; i--) {
            let p = activePhotos[i];
            p.y += p.speedY;
            p.rotX += p.rotSpeedX;
            p.rotY += p.rotSpeedY;

            p.element.style.transform = `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateX(${p.rotX}deg) rotateY(${p.rotY}deg) rotateZ(${p.rotZ}deg)`;

            if (p.y > window.innerHeight + 150) {
                p.element.remove();
                activePhotos.splice(i, 1);
            }
        }
        requestAnimationFrame(update3DPhotos);
    }

    const overlay = document.getElementById('startOverlay');
    const music = document.getElementById('bgMusic');

    overlay.addEventListener('click', () => {
        if (music) {
            music.play().then(() => {
                console.log("Nhạc đang chạy!");
            }).catch(e => console.log(e));
        }
        
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 800);

        // Nhịp độ rơi bình thường lặp lại đều đặn
        setInterval(create3DPhoto, 650);
        requestAnimationFrame(update3DPhotos);
    });

    window.addEventListener('resize', () => {
        size = setupCanvas(matrixCanvas);
        setupCanvas(textCanvas);
        columns = Math.floor(size.width / fontSize);
        drops = Array(columns).fill(0).map(() => Math.random() * -100);
    });
</script>
</body>
</html>
